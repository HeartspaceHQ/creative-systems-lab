[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creative-systems-lab"
version = "0.3.0"
description = "Model-agnostic, brand-governed generative image production with reproducibility manifests, automated evaluation and human review."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
csl = "csl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["mflux: needs a local mflux install and cached FLUX.2 weights (skipped otherwise)"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
# Only rules that conflict with each other or with the formatter. Nothing is silenced inline.
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "COM812", # conflicts with the formatter
  "ISC001", # conflicts with the formatter
  "D105", "D107",  # docstrings on magic methods / __init__ add nothing
  "CPY001", # copyright headers: stated once, in LICENSE
]

[tool.ruff.lint.per-file-ignores]
# pytest idioms: bare assert, magic numbers in expected values, fixtures without docstrings.
# The mflux backend runs a fixed local tool with an argument list (no shell). Inputs are
# validated models, not free text; subprocess is the point of that module.
"src/csl/backends/mflux.py" = ["S603"]
# The hosted transport refuses every URL that is not https:// before opening it (checked in
# UrllibTransport.send and tested); S310 cannot see that guard.
"src/csl/backends/hosted.py" = ["S310"]
# The studio runs the Node render engine with a fixed argument list (no shell); the only
# variable parts are folders it created itself.
"src/csl/web/engine.py" = ["S603"]
"src/csl/web/deliveries.py" = ["S603"]
# http.server dictates the names do_GET/do_POST and the log_message(format, ...) signature.
"src/csl/web/server.py" = ["N802", "A002", "ARG002"]
"tests/**" = ["S101", "PLR2004", "D", "ANN401", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime, so these imports must stay real imports.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "csl.schema._Model"]

[tool.ruff.lint.pylint]
max-args = 7
